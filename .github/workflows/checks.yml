name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Model tests
        run: npm test
      - name: JavaScript syntax
        run: |
          for file in extension/*.js scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done
      - name: Build release packages
        run: npm run package
      - name: Check Chrome Web Store package
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          version = json.loads(pathlib.Path('extension/manifest.json').read_text())['version']
          path = pathlib.Path(f'dist/go-through-tabs-chrome-web-store-{version}.zip')
          with zipfile.ZipFile(path) as package:
              assert package.testzip() is None
              assert 'manifest.json' in package.namelist()
              assert json.loads(package.read('manifest.json'))['version'] == version
              assert all(not name.startswith(('tests/', 'node_modules/')) for name in package.namelist())
          print('Chrome Web Store ZIP verified')
          PY
